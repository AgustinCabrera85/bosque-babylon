<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosque Babylon</title>
  </head>
  <body>
    <div id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-panel">
        <div class="loading-title">Bosque Babylon</div>
        <div id="loadingText">Preparando escena...</div>
        <div class="loading-track">
          <div id="loadingBar"></div>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="help">
        Click para entrar<br/>
        <span class="small">V camara · F linterna · botones 1P/3P/FR</span><br/>
        <span class="small">WASD mover · Shift correr · Space saltar · E interactuar · Esc pausa</span>
      </div>
      <div id="hint" class="hidden"></div>
      <div id="reticle" aria-hidden="true"></div>

      <div id="viewControls" aria-label="Modo de camara">
        <button id="firstPersonButton" type="button" aria-label="Primera persona" aria-pressed="false">1P</button>
        <button id="thirdPersonButton" type="button" aria-label="Tercera persona" aria-pressed="true">3P</button>
        <button id="frontPersonButton" type="button" aria-label="Ver personaje de frente" aria-pressed="false">FR</button>
        <button id="flashlightButton" type="button" aria-label="Encender o apagar linterna" aria-pressed="true">F</button>
        <button id="pauseButton" type="button" aria-label="Pausar juego" aria-pressed="false">II</button>
      </div>

      <div id="musicControls" aria-label="Music volume">
        <button id="musicToggle" type="button" aria-label="Mute music">Music</button>
        <input id="musicVolume" type="range" min="0" max="100" step="1" value="45" aria-label="Music volume" />
        <span id="musicVolumeValue">45%</span>
      </div>

      <div id="mobileControls" aria-hidden="true">
        <div id="moveStick" class="stick" data-stick="move">
          <div class="stick-thumb"></div>
        </div>
        <div id="lookPad"></div>
        <button id="runButton" class="mobile-button" type="button" aria-label="Correr">R</button>
        <button id="jumpButton" class="mobile-button" type="button" aria-label="Saltar">↑</button>
        <button id="interactButton" class="mobile-button" type="button" aria-label="Interactuar">E</button>
      </div>
    </div>

    <div id="pauseMenu" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <div class="pause-panel">
        <div class="pause-header">
          <h1 id="pauseTitle">Pausa</h1>
          <button id="resumeButton" class="icon-button" type="button" aria-label="Continuar">X</button>
        </div>

        <div class="pause-sliders" aria-label="Audio">
          <label class="volume-row" for="pauseMusicVolume">
            <span>Musica</span>
            <input id="pauseMusicVolume" type="range" min="0" max="100" step="1" value="45" />
            <strong id="pauseMusicVolumeValue">45%</strong>
          </label>

          <label class="volume-row" for="pauseAmbientVolume">
            <span>Ambiente</span>
            <input id="pauseAmbientVolume" type="range" min="0" max="100" step="1" value="55" />
            <strong id="pauseAmbientVolumeValue">55%</strong>
          </label>

          <label class="volume-row" for="pauseSfxVolume">
            <span>SFX</span>
            <input id="pauseSfxVolume" type="range" min="0" max="100" step="1" value="70" />
            <strong id="pauseSfxVolumeValue">70%</strong>
          </label>
        </div>

        <button id="resumeLargeButton" class="primary-button" type="button">Continuar</button>
      </div>
    </div>

    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
