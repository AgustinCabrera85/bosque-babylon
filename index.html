<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosque Babylon</title>
  </head>
  <body>
    <div id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-panel">
        <div class="loading-title">Bosque Babylon</div>
        <div id="loadingText">Preparando escena...</div>
        <div class="loading-track">
          <div id="loadingBar"></div>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="help">
        Click para entrar<br/>
        <span class="small">V 1P/3P - F linterna - Esc pausa</span><br/>
        <span class="small">WASD mover - Shift correr - Space saltar - E interactuar</span>
      </div>
      <div id="hint" class="hidden"></div>
      <div id="reticle" aria-hidden="true"></div>

      <div id="viewControls" aria-label="Modo de camara">
        <button id="cameraModeButton" type="button" aria-label="Cambiar camara primera/tercera persona" aria-pressed="false">1P</button>
        <button id="frontCameraButton" type="button" aria-label="Activar camara frontal" aria-pressed="false">FR</button>
        <button id="flashlightButton" type="button" aria-label="Encender o apagar linterna" aria-pressed="true">F</button>
        <button id="pauseButton" type="button" aria-label="Pausar juego" aria-pressed="false">II</button>
      </div>

      <div id="mobileControls" aria-hidden="true">
        <div id="moveStick" class="stick" data-stick="move">
          <div class="stick-thumb"></div>
        </div>
        <div id="lookPad"></div>
        <button id="runButton" class="mobile-button" type="button" aria-label="Correr">R</button>
        <button id="jumpButton" class="mobile-button" type="button" aria-label="Saltar">^</button>
        <button id="interactButton" class="mobile-button" type="button" aria-label="Interactuar">E</button>
        <button id="mobileCameraButton" class="mobile-button" type="button" aria-label="Cambiar camara primera/tercera persona" aria-pressed="false">1P</button>
      </div>
    </div>

    <div id="pauseMenu" class="pause-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <section class="menu-panel">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <header class="menu-header">
          <p class="menu-kicker">Bosque Babylon</p>
          <h1 id="pauseTitle" class="menu-title">Pausa</h1>
        </header>

        <div class="settings-grid">
          <section class="settings-section" aria-labelledby="audioSettingsTitle">
            <h2 id="audioSettingsTitle" class="section-title">Audio</h2>
            <div class="settings">
              <div class="setting-row">
                <label class="setting-label" for="musicVolume">Musica</label>
                <input id="musicVolume" type="range" min="0" max="100" step="1" value="70" />
                <span class="value" id="musicValue">70%</span>
              </div>

              <div class="setting-row">
                <label class="setting-label" for="ambientVolume">Ambiente</label>
                <input id="ambientVolume" type="range" min="0" max="100" step="1" value="85" />
                <span class="value" id="ambientValue">85%</span>
              </div>

              <div class="setting-row">
                <label class="setting-label" for="sfxVolume">SFX</label>
                <input id="sfxVolume" type="range" min="0" max="100" step="1" value="80" />
                <span class="value" id="sfxValue">80%</span>
              </div>
            </div>
          </section>

          <section class="settings-section" aria-labelledby="videoSettingsTitle">
            <h2 id="videoSettingsTitle" class="section-title">Video</h2>
            <label class="toggle-row" for="postProcessingToggle">
              <span class="setting-label">Filtro VHS</span>
              <input id="postProcessingToggle" type="checkbox" checked />
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
            </label>
          </section>
        </div>

        <div class="menu-actions">
          <button class="menu-button" id="saveButton" type="button">Guardar</button>
          <button class="menu-button secondary" id="exitButton" type="button">Salir</button>
        </div>

        <div id="pauseStatus" class="pause-status" aria-live="polite"></div>
      </section>
    </div>

    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
