  <title>PlayStation circle button</title>
  
  <circle cx="64" cy="64" r="50" fill="#101318" fill-opacity="0.88" stroke="#FFFFFF" stroke-width="8"/>
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="64" r="22" fill="none" stroke-width="9"/>
  </g>

  </symbol>
